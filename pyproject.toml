[project]
name = "geosituation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SaharshDaNerd", email = "saharshcodes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.7",
    "jinja2>=3.1.6",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
geosituation = "geosituation:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
